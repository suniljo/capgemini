<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Streaming OpenAI Demo</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 80px; font-size: 1rem; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 8px 16px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #output { margin-top: 20px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; min-height: 120px; white-space: pre-wrap; line-height: 1.5; }
  .cursor { display: inline-block; width: 8px; background: #333; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #status { font-size: 0.85rem; color: #777; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Streaming OpenAI Response Demo</h1>
  <textarea id="prompt" placeholder="Ask something...">Write a short paragraph about why streaming responses improve perceived latency.</textarea>
  <br>
  <button id="sendBtn">Send</button>
  <div id="status"></div>
  <div id="output"><span id="text"></span><span class="cursor" id="cursor">&nbsp;</span></div>

<script>
  const sendBtn = document.getElementById('sendBtn');
  const promptEl = document.getElementById('prompt');
  const textEl = document.getElementById('text');
  const statusEl = document.getElementById('status');
  const cursorEl = document.getElementById('cursor');

  let eventSource = null;

  sendBtn.addEventListener('click', () => {
    const prompt = promptEl.value.trim();
    if (!prompt) return;

    // Reset UI for a new stream
    textEl.textContent = '';
    statusEl.textContent = 'Connecting...';
    cursorEl.style.display = 'inline-block';
    sendBtn.disabled = true;

    if (eventSource) {
      eventSource.close();
    }

    // GET + query param, since EventSource only supports GET requests
    const url = '/api/chat/stream?prompt=' + encodeURIComponent(prompt);
    eventSource = new EventSource(url);

    eventSource.addEventListener('message', (event) => {
      statusEl.textContent = 'Streaming...';
      // Append each incremental chunk as it arrives - this is what makes
      // the response appear to "type itself out" in real time.
      textEl.textContent += event.data;
    });

    eventSource.addEventListener('complete', () => {
      statusEl.textContent = 'Done';
      cursorEl.style.display = 'none';
      eventSource.close();
      sendBtn.disabled = false;
    });

    eventSource.onerror = () => {
      statusEl.textContent = 'Stream error or connection closed.';
      cursorEl.style.display = 'none';
      eventSource.close();
      sendBtn.disabled = false;
    };
  });
</script>
</body>
</html>
