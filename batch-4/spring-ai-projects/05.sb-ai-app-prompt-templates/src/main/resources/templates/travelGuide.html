<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Travel Guidance</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Marked.js (Markdown Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-airplane"></i> AI Travel Guide
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Input Card -->
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center">
                    <h4><i class="bi bi-globe"></i> Plan Your Trip</h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/api/showTravelGuide}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Destination</label>
                            <input type="text" class="form-control" name="place" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Travel Month</label>
                            <input type="text" class="form-control" name="month" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Language</label>
                            <select class="form-select" name="language">
                                <option>English</option>
                                <option>Hindi</option>
                                <option>Telugu</option>
								<option>Thai</option>
								<option>Malayalam</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Budget</label>
                            <input type="text" class="form-control" name="budget" required>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg">
                                <i class="bi bi-search"></i> Get Travel Guide
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <!-- Response Card -->
            <div class="card shadow mt-4" th:if="${response}">
                <div class="card-header bg-success text-white">
                    <h5>
                        <i class="bi bi-info-circle"></i>
                        Travel Guide for <span th:text="${place}"></span>
                    </h5>
                </div>

                <div class="card-body">
                    <!-- Raw markdown (hidden) -->
                    <textarea id="markdownText" class="d-none"
                              th:text="${response}"></textarea>

                    <!-- Rendered HTML -->
                    <div id="markdownOutput" class="markdown-body"></div>
                </div>
            </div>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Markdown Rendering Script -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const markdownText = document.getElementById("markdownText");
        const outputDiv = document.getElementById("markdownOutput");

        if (markdownText && outputDiv) {
            const markdown = markdownText.value;
            outputDiv.innerHTML = marked.parse(markdown);
        }
    });
</script>

</body>
</html>
