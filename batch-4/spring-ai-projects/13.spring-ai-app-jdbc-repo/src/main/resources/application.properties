spring.application.name=13.spring-ai-app-jdbc-repo

# MySQL Connection Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_capgemini?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root


# Spring AI JDBC Chat Memory Initialization
# Options: always, embedded, never
# Spring AI 2.0 Schema Initialization
# Ensures the new 2.0 table structure (with sequence_id) initializes cleanly
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o