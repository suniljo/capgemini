<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ask AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f7f7f8;
        }

        .chat-container {
            max-width: 800px;
            margin: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
            background: #fff;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f7f7f8;
        }

        .chat-message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .user-message {
            background-color: #0d6efd;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        .ai-message {
            background-color: #ffffff;
            border: 1px solid #ddd;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }

        .chat-footer {
            padding: 15px;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        .chat-input {
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
        Ask AI 
    </div>

    <!-- Chat Body -->
    <div class="chat-body">

        <!-- User Question -->
        <div class="chat-message user-message" th:if="${question}">
            <strong>You:</strong><br>
            <span th:text="${question}"></span>
        </div>

        <!-- AI Answer -->
        <div class="chat-message ai-message" th:if="${answer}">
            <strong>AI:</strong><br>
            <span th:text="${answer}"></span>
        </div>

    </div>

    <!-- Input -->
    <div class="chat-footer">
        <form th:action="@{askAnything}" method="post" class="d-flex gap-2">
            <input type="text" name="question" class="form-control chat-input"
                   placeholder="Message Ask AI..." required>
            <button class="btn btn-primary px-4">Send</button>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
